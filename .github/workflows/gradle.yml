name: Nomi Launcher CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk+fx
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and build Nomi launcher
        run: ./gradlew :HMCL:test --tests '*NomiServiceTest' :HMCL:shadowJar --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: nomi-launcher-dev
          path: HMCL/build/libs/HMCL-*.jar
