name: Nomi CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nomi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-package: jdk+fx
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Test launcher, core and build tools
        run: .\gradlew.bat :buildSrc:test :HMCLCore:test :HMCL:test --no-daemon --console plain
